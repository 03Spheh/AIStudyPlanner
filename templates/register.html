<!DOCTYPE html>

<html>

<head>
<link rel="stylesheet" href="{{ url_for('static', filename='theme.css') }}">
```
<title>Register | AI Study Planner</title>

<style>

    body {
        margin: 0;
        font-family: Arial, sans-serif;
        background: #e8dccb;
        min-height: 100vh;
        display: flex;
        justify-content: center;
        align-items: center;
    }

    .container {
        width: 420px;
        background: white;
        padding: 40px;
        border-radius: 18px;
        box-shadow: 0 10px 35px rgba(0,0,0,0.15);
    }

    h1 {
        text-align: center;
        color: #33251f;
    }

    .subtitle {
        text-align: center;
        color: #777;
        margin-bottom: 30px;
    }

    label {
        font-weight: bold;
    }

    input {
        width: 100%;
        padding: 14px;
        margin: 8px 0 20px;
        border: 1px solid #ccc;
        border-radius: 8px;
        box-sizing: border-box;
    }

    button {
        width: 100%;
        padding: 14px;
        border: none;
        border-radius: 8px;
        background: #33251f;
        color: white;
        font-size: 16px;
        cursor: pointer;
    }

    button:hover {
        background: #574239;
    }

    .error {
        background: #f8dddd;
        color: #8a2222;
        padding: 12px;
        border-radius: 8px;
        margin-bottom: 20px;
    }

    .login {
        text-align: center;
        margin-top: 25px;
    }

    a {
        color: #33251f;
        font-weight: bold;
    }

</style>
```

</head>

<body>

<div class="container">

```
<h1>📚 Create Account</h1>

<p class="subtitle">
    Start your personalized study journey.
</p>

{% if error %}

<div class="error">
    {{ error }}

</div>

{% endif %}

<form method="POST">

    <label>Full Name</label>

    <input
        type="text"
        name="full_name"
        placeholder="Enter your full name"
        required
    >

    <label>Email</label>

    <input
        type="email"
        name="email"
        placeholder="Enter your email"
        required
    >

    <label>Password</label>

    <input
        type="password"
        name="password"
        placeholder="Create a password"
        required
    >

    <label>Confirm Password</label>

    <input
        type="password"
        name="confirm_password"
        placeholder="Confirm your password"
        required
    >

    <button type="submit">
        Create Account
    </button>

</form>

<div class="login">

    Already have an account?

    <a href="/login">
        Login
    </a>

</div>
```

</div>

</body>

</html>
